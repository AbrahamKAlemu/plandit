# XcodeGen spec. Regenerate the project after adding/removing files:  xcodegen generate
name: Plandit

options:
  bundleIdPrefix: com.plandit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # set your team ID here (or in Xcode → Signing & Capabilities)

targets:
  Plandit:
    type: application
    platform: iOS
    sources:
      - path: Plandit
      - path: Shared
    info:
      path: Plandit/Resources/Info.plist
      properties:
        CFBundleDisplayName: Plandit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Plandit uses your location to start today's route from where you are.
        NSSpeechRecognitionUsageDescription: Plandit can transcribe a video on this device to identify the place you want to save.
        UIAppFonts: [Manrope-Regular.ttf, Manrope-Medium.ttf, Manrope-SemiBold.ttf, Manrope-Bold.ttf, Manrope-ExtraBold.ttf]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Plandit/Resources/Plandit.entitlements
      properties:
        com.apple.security.application-groups: [group.com.plandit.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plandit.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PlanditShare

  PlanditShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PlanditShare
      - path: Shared
    info:
      path: PlanditShare/Info.plist
      properties:
        CFBundleDisplayName: Plandit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Manrope-Regular.ttf, Manrope-Medium.ttf, Manrope-SemiBold.ttf, Manrope-Bold.ttf, Manrope-ExtraBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: PlanditShare/PlanditShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.plandit.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plandit.app.share
        APPLICATION_EXTENSION_API_ONLY: YES

  PlanditTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlanditTests
    dependencies:
      - target: Plandit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plandit.app.tests
        GENERATE_INFOPLIST_FILE: YES

  PlanditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlanditUITests
    dependencies:
      - target: Plandit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plandit.app.uitests
        TEST_TARGET_NAME: Plandit
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Plandit:
    build:
      targets:
        Plandit: all
        PlanditTests: [test]
        PlanditUITests: [test]
    test:
      targets:
        - PlanditTests
        - PlanditUITests
    run:
      config: Debug
    archive:
      config: Release
