# Render Blueprint for the Plandit API. Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked `sync: false` are prompted for on first deploy and never stored here.
services:
  - type: web
    name: plandit-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia # same coast as the Supabase project (us-east-1)
    plan: free # sleeps after 15 min idle (30-60 s cold start); switch to starter when testers grow
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,api.plandit.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://api.plandit.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://plandit.app,https://www.plandit.app
      - key: SUPABASE_URL
        value: https://bkjepupqdwkraajyewyy.supabase.co
      - key: DATABASE_URL
        sync: false # Supabase session-pooler URI with ?sslmode=require
      - key: ENSEMBLEDATA_ENABLED
        value: "1"
      - key: ENSEMBLEDATA_API_TOKEN
        sync: false
      - key: SOCIAL_EVIDENCE_THROTTLE_RATE
        value: 30/day
      - key: WEB_CONCURRENCY
        value: "2"
