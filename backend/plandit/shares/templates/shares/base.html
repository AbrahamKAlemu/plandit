<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d0c">
  <title>{% block title %}Plandit{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" type="image/png" href="https://plandit.app/images/favicon-32.png">
  <link rel="apple-touch-icon" href="https://plandit.app/images/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --green: #19c879; --green-dark: #087a4b; --lime: #d9ff52; --ink: #0b0d0c;
      --paper: #fbfaf6; --cream: #f4f1e9; --muted: #626761; --line: rgba(11,13,12,.12);
      --on-dark: #f4f1e9; --on-dark-muted: rgba(244,241,233,.68);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--on-dark); font: 400 16px/1.5 "Manrope", system-ui, sans-serif;
      background: radial-gradient(120% 60% at 50% -10%, rgba(25,200,121,.35), transparent 60%), var(--ink);
    }
    a { color: inherit; }
    .page { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -.03em; text-decoration: none; font-size: 18px; }
    .brand img { border-radius: 9px; }
    .brand span span { color: var(--green); }
    .cta {
      display: block; text-align: center; text-decoration: none; font-weight: 800; color: var(--ink);
      background: var(--lime); border-radius: 999px; padding: 15px 20px; margin-top: 12px;
    }
    .cta:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
    footer { margin-top: 36px; text-align: center; color: var(--on-dark-muted); font-size: 14px; }
    footer .brand { justify-content: center; color: var(--on-dark); margin-bottom: 6px; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <main class="page">
    {% block content %}{% endblock %}
    <footer>
      <a class="brand" href="https://plandit.app"><img src="https://plandit.app/images/logo-mark-app-icon.png" width="28" height="28" alt=""><span>Pland<span>it</span></span></a>
      <div>Turn the places you save into a plan you actually go do.</div>
      <a class="cta" href="https://plandit.app">Make your own plan</a>
    </footer>
  </main>
</body>
</html>
